name: Bikin APK

on:
  push:
  workflow_dispatch:   # tombol "Run workflow" di tab Actions

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cek alamat Worker di public/config.js
        run: |
          if ! grep -Eq '^[[:space:]]*window\.RYTHM_API[[:space:]]*=[[:space:]]*"https://' public/config.js; then
            echo "::error::public/config.js belum diisi alamat Worker. Isi dengan: window.RYTHM_API = \"https://rythm.NAMAKAMU.workers.dev\";"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: npm ci

      - name: Siapkan proyek Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Pasang ikon RYTHM
        run: |
          pip install pillow
          python3 tools/icons.py

      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: RYTHM-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
